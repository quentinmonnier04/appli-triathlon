<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ENF-12 : seul intervals.icu est joignable ; aucun script, police ou style externe (ENF-21) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://intervals.icu; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0E1013">
  <meta name="color-scheme" content="dark">
  <title>Triathlon</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="maj"></div>
  <main id="app"></main>
  <!-- Barre de navigation flottante (9.1) : les onglets des lots non livrés sont absents -->
  <nav id="navigation" class="navigation masque" aria-label="Navigation principale">
    <a href="#/accueil" data-onglet="accueil"><span class="nav-icone" aria-hidden="true">🏠</span><span>Accueil</span></a>
    <a href="#/agenda" data-onglet="agenda"><span class="nav-icone" aria-hidden="true">📅</span><span>Agenda</span></a>
    <a href="#/seance/nouvelle" data-onglet="seance" class="nav-programmer" aria-label="Programmer une séance"><span class="nav-plus" aria-hidden="true">+</span></a>
    <a href="#/activites" data-onglet="activites"><span class="nav-icone" aria-hidden="true">📋</span><span>Activités</span></a>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
